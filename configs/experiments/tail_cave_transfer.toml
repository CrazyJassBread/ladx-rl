# The first Tail Cave skill-transfer benchmark.
# Room tuples are (is_indoor, map_id, room_id), all in decimal TOML values.

[defaults]
frame_skip = 4
max_episode_steps = 2500
total_timesteps = 1000000
action_names = [
  "NOOP", "UP", "DOWN", "LEFT", "RIGHT", "A", "B",
  "UP_A", "DOWN_A", "LEFT_A", "RIGHT_A",
  "UP_B", "DOWN_B", "LEFT_B", "RIGHT_B",
]

# PPO settings
[ppo]
policy = "CnnPolicy"
n_steps = 512
batch_size = 128
n_epochs = 4
learning_rate = 0.00025
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.1
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
frame_stack = 4
eval_freq = 25000
checkpoint_freq = 100000
eval_episodes = 20

# A/B: complete room 0x16 task, with and without reset-time variation.
[instances.room16_key_fixed]
states = ["save_states/azle.gbc.tail_cave.r2.state"]
expected_room = [1, 0, 22]
noop_frames = [0, 0]
task_config = "configs/tasks/room16_key.toml"

[instances.room16_key_train]
states = ["save_states/azle.gbc.tail_cave.r2.state"]
expected_room = [1, 0, 22]
noop_frames = [0, 15]
task_config = "configs/tasks/room16_key.toml"

[instances.room16_key_eval]
states = ["save_states/azle.gbc.tail_cave.r2.state"]
expected_room = [1, 0, 22]
noop_frames = [16, 30]
task_config = "configs/tasks/room16_key.toml"

# Hardhat-removal skill, independent of the room's follow-up effect.
[instances.room16_hardhats]
states = ["save_states/azle.gbc.tail_cave.r2.state"]
expected_room = [1, 0, 22]
noop_frames = [0, 15]
task_config = "configs/tasks/hardhat_removal.toml"

[instances.room09_hardhat_train]
states = ["save_states/azle.gbc.tail_cave.r11.state"]
expected_room = [1, 0, 9]
noop_frames = [0, 15]
task_config = "configs/tasks/hardhat_removal.toml"

[instances.room09_hardhat_eval]
states = ["save_states/azle.gbc.tail_cave.r27.state"]
expected_room = [1, 0, 9]
noop_frames = [16, 30]
task_config = "configs/tasks/hardhat_removal.toml"

# Train on two kill-all rooms and hold out a third room and enemy mechanic.
[instances.room12_keese]
states = ["save_states/azle.gbc.tail_cave.r5.state"]
expected_room = [1, 0, 18]
noop_frames = [0, 15]
task_config = "configs/tasks/keese_clear.toml"

# Complete room 0x12: defeat all four Keese, then leave through the upper door
# into room 0x0D. Train/eval use disjoint reset-time jitter ranges.
[instances.room12_keese_exit_train]
states = ["save_states/azle.gbc.tail_cave.r5.state"]
expected_room = [1, 0, 18]
noop_frames = [0, 15]
max_episode_steps = 1200
task_config = "configs/tasks/room12_keese_exit.toml"

[instances.room12_keese_exit_eval]
states = ["save_states/azle.gbc.tail_cave.r5.state"]
expected_room = [1, 0, 18]
noop_frames = [16, 30]
max_episode_steps = 1200
task_config = "configs/tasks/room12_keese_exit.toml"

# r6 capture: defeat the Mini Moldorm in room 0x0D, open the revealed
# 20-Rupee chest, and dismiss its item dialog.
[instances.room0d_moldorm_rupees_train]
states = ["save_states/azle.gbc.tail_cave.r6.state"]
expected_room = [1, 0, 13]
noop_frames = [0, 15]
max_episode_steps = 1200
task_config = "configs/tasks/room0d_moldorm_rupees.toml"

[instances.room0d_moldorm_rupees_eval]
states = ["save_states/azle.gbc.tail_cave.r6.state"]
expected_room = [1, 0, 13]
noop_frames = [16, 30]
max_episode_steps = 1200
task_config = "configs/tasks/room0d_moldorm_rupees.toml"

# Same success contract as the sparse baseline, with post-clear route
# supervision toward the chest. Separate instances preserve the original
# reset_jitter reward configuration for reproducible comparisons.
[instances.room0d_moldorm_rupees_route_train]
states = ["save_states/azle.gbc.tail_cave.r6.state"]
expected_room = [1, 0, 13]
