states = ["save_states/azle.gbc.tail_cave.r10.state"]
expected_room = [1, 0, 10]
noop_frames = [64, 127]
max_episode_steps = 1600
task_config = "configs/tasks/room0a_three_of_a_kind_pattern.toml"

[instances.room0a_three_of_a_kind_stone_beak_train]
states = ["save_states/azle.gbc.tail_cave.r10.state"]
