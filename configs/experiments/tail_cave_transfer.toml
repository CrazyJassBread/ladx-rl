[instances.room0d_moldorm_rupees_route_eval]
states = ["save_states/azle.gbc.tail_cave.r6.state"]
expected_room = [1, 0, 13]
noop_frames = [16, 30]
max_episode_steps = 1200
task_config = "configs/tasks/room0d_moldorm_rupees_route.toml"

# Hazard-aware revision: broader monster-phase variation and a bounded safe
