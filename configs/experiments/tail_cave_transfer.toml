expected_room = [1, 0, 13]
noop_frames = [61, 120]
max_episode_steps = 1200
task_config = "configs/tasks/room0d_moldorm_rupees_safe_route.toml"

# r10 capture: the Three-of-a-Kind enemies cycle through four patterns. A hit
