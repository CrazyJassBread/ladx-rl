[experiments."room16_key/fixed"]
description = "Sanity check: learn and evaluate the full r2 task from one fixed state."
train = ["room16_key_fixed"]
eval = ["room16_key_fixed"]
total_timesteps = 1000000

[experiments."room16_key/reset_jitter"]
description = "Same-room temporal generalization with disjoint reset jitter ranges."
train = ["room16_key_train"]
eval = ["room16_key_eval"]
total_timesteps = 1000000

[experiments."hardhat_transfer/room16_to_room09"]
description = "Zero-shot Hardhat skill transfer from room 0x16 to room 0x09."
train = ["room16_hardhats"]
eval = ["room09_hardhat_eval"]
total_timesteps = 1000000

[experiments."kill_all_transfer/room16_room12_to_room03"]
description = "Multi-room kill-all training with an unseen room and enemy type held out."
train = ["room16_hardhats", "room12_keese"]
eval = ["room03_spiked_beetles"]
total_timesteps = 2000000

[experiments."room12_keese_exit/reset_jitter"]
description = "Defeat all four Keese in room 0x12, then enter room 0x0D through the upper door."
train = ["room12_keese_exit_train"]
eval = ["room12_keese_exit_eval"]
total_timesteps = 1500000

[experiments."room0d_moldorm_rupees/reset_jitter"]
description = "Defeat the Mini Moldorm in room 0x0D, open the 20-Rupee chest, and finish its dialog."
train = ["room0d_moldorm_rupees_train"]
eval = ["room0d_moldorm_rupees_eval"]
total_timesteps = 1500000

[experiments."room0d_moldorm_rupees/chest_route"]
description = "Scratch baseline with signed post-clear route shaping toward the room 0x0D chest."
train = ["room0d_moldorm_rupees_route_train"]
eval = ["room0d_moldorm_rupees_route_eval"]
total_timesteps = 1500000

[experiments."room0d_moldorm_rupees/chest_route_finetune"]
description = "Fine-tune the sparse room 0x0D combat policy with post-clear chest-route shaping."
train = ["room0d_moldorm_rupees_route_train"]
eval = ["room0d_moldorm_rupees_route_eval"]
pretrained_from = "room0d_moldorm_rupees/reset_jitter"
total_timesteps = 500000

[experiments."room0d_moldorm_rupees/safe_route"]
description = "Scratch baseline with pursuit shaping and a hazard-aware bounded chest-route potential."
train = ["room0d_moldorm_rupees_safe_train"]
eval = ["room0d_moldorm_rupees_safe_eval"]
total_timesteps = 1500000

[experiments."room0d_moldorm_rupees/safe_route_finetune"]
description = "Fine-tune the sparse combat policy with pursuit and hazard-aware chest-route shaping."
train = ["room0d_moldorm_rupees_safe_train"]
eval = ["room0d_moldorm_rupees_safe_eval"]
pretrained_from = "room0d_moldorm_rupees/reset_jitter"
total_timesteps = 750000

[experiments."room0a_three_of_a_kind/pattern_curriculum"]
description = "Curriculum stage 1: freeze all three enemies on one accepted pattern."
train = ["room0a_three_of_a_kind_pattern_train"]
eval = ["room0a_three_of_a_kind_pattern_eval"]
total_timesteps = 2000000

[experiments."room0a_three_of_a_kind/full_scratch"]
description = "Scratch baseline for matching the pattern, revealing the chest, and receiving the Stone Beak."
train = ["room0a_three_of_a_kind_stone_beak_train"]
eval = ["room0a_three_of_a_kind_stone_beak_eval"]
total_timesteps = 3000000

[experiments."room0a_three_of_a_kind/curriculum_finetune"]
description = "Fine-tune the pattern policy to open the chest and finish the Stone Beak dialog."
train = ["room0a_three_of_a_kind_stone_beak_train"]
eval = ["room0a_three_of_a_kind_stone_beak_eval"]
pretrained_from = "room0a_three_of_a_kind/pattern_curriculum"
total_timesteps = 1500000

[experiments."room09_hardhat/reset_jitter"]
description = "Fine-tune the room 0x16 Hardhat policy on room 0x09 and compare with scratch."
train = ["room09_hardhat_train"]
eval = ["room09_hardhat_eval"]
pretrained_from = "hardhat_transfer/room16_to_room09"
total_timesteps = 500000

[experiments."room15_compass/reset_jitter"]
description = "Defeat four hiding Zols, open the central chest, and acquire the Compass."
train = ["room15_compass_train"]
eval = ["room15_compass_eval"]
total_timesteps = 2000000

[experiments."room13_switch_chest/reset_jitter"]
description = "Shaped scratch baseline: follow the safe route, press the switch, and open the key chest."
train = ["room13_switch_chest_train"]
eval = ["room13_switch_chest_eval"]
total_timesteps = 2000000

[experiments."room13_press_switch/curriculum"]
description = "Curriculum stage 1: navigate around the pits and hold the floor switch for 24 frames."
train = ["room13_press_switch_train"]
eval = ["room13_press_switch_eval"]
total_timesteps = 1000000

[experiments."room13_switch_chest/curriculum_finetune"]
description = "Curriculum stage 2: fine-tune the switch policy to reach and open the revealed chest."
train = ["room13_switch_chest_train"]
eval = ["room13_switch_chest_eval"]
pretrained_from = "room13_press_switch/curriculum"
total_timesteps = 1000000
