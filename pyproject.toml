[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelda-env"
version = "0.1.0"
description = "Gymnasium-compatible 2D Zelda reinforcement learning environments."
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0.0",
  "numpy>=1.26",
  "pyboy>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
train = [
  "stable-baselines3>=2.4",
  "tensorboard>=2.18",
]

[project.scripts]
zelda-validate = "scripts.validate_env:main"
zelda-train = "scripts.train:main"
zelda-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["zelda_env*", "scripts*", "training*"]

[tool.pytest.ini_options]
markers = ["rom: requires the locally built LADX ROM and PyBoy"]
